[package]
name = "rust-bash-classify"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT"
authors = ["Chrysent LLC"]
description = "Classify Bash commands by side-effect risk for AI-agent safety hooks"
readme = "README.md"
repository = "https://github.com/Chrysent-AI/rust-bash-classify"
homepage = "https://github.com/Chrysent-AI/rust-bash-classify"
# An allowlist keeps local environment files, hooks and tooling out of the crate.
include = [
    "/Cargo.toml", "/Cargo.lock", "/src/**/*.rs",
    "/vendor/commands/*.yaml", "/vendor/schemas/command.schema.json",
    "/LICENSE", "/NOTICE", "/vendor/LICENSE", "/vendor/NOTICE",
    "/README.md", "/CHANGELOG.md", "/RELEASING.md",
    "!**/.env*",
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[lib]
name = "bash_classify"
path = "src/lib.rs"

[[bin]]
name = "rust-bash-classify"
path = "src/bin/rust-bash-classify.rs"

[dependencies]
tree-sitter = "0.25"
tree-sitter-bash = "=0.25.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"

[dev-dependencies]
jsonschema = "0.30"
