name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Check vendored data and generated code
        run: |
          set -euo pipefail
          source_commit=$(python3 - <<'PY'
          import json
          with open('VENDOR.json', encoding='utf-8') as f:
              print(json.load(f)['source']['commit'])
          PY
          )
          source_dir=$(mktemp -d)
          git clone --filter=blob:none https://github.com/fprochazka/bash-classify.git "$source_dir"
          git -C "$source_dir" checkout --detach "$source_commit"
          BASH_CLASSIFY_SOURCE_DIR="$source_dir" scripts/vendor.sh --check
          scripts/gen_commands_data.sh
          git diff --exit-code -- src/commands_data.rs
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build
      - name: Test
        run: cargo test
